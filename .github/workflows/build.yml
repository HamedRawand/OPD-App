name: Build & Publish

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (Windows / .NET 10)
    runs-on: windows-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── .NET 10 ──────────────────────────────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── Restore ──────────────────────────────────────────────────────────────
      - name: Restore packages
        run: dotnet restore OPDClinic.sln

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build (Release)
        run: dotnet build OPDClinic.sln -c Release --no-restore --no-incremental

      # ── Publish self-contained win-x64 ────────────────────────────────────────
      - name: Publish win-x64
        run: >
          dotnet publish OPDClinic.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/OPDClinic
          --no-restore

      # ── Upload artifact ───────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPDClinic-win-x64
          path: publish/OPDClinic/
          retention-days: 7
          if-no-files-found: error
